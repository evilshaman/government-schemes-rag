apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gov-schemes-hpa
  namespace: gov-schemes
  labels:
    app.kubernetes.io/name: gov-schemes-rag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gov-schemes-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
