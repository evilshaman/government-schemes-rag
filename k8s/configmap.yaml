apiVersion: v1
kind: ConfigMap
metadata:
  name: gov-schemes-config
  namespace: gov-schemes
  labels:
    app.kubernetes.io/name: gov-schemes-rag
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  HOST: "0.0.0.0"
  PORT: "8000"
  WEB_CONCURRENCY: "4"
  CORS_ORIGINS: "*"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_DEFAULT: "120/minute"
  RATE_LIMIT_ANALYZE: "30/minute"
  RATE_LIMIT_CHAT: "60/minute"
  MAX_UPLOAD_SIZE_BYTES: "15728640"
  METRICS_ENABLED: "true"
